<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المخازن</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<!-- مكتبة Supabase (تسجيل الدخول وقاعدة البيانات) — ضرورية من أول لحظة، فتتحمّل فورًا -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- ملحوظة: مكتبتا Excel والباركود بقوا يتحمّلوا فقط لما فعليًا يُستخدموا (تصدير/استيراد/باركود) بدل كل فتحة للبرنامج، عشان يفتح أسرع -->
</head>
<body>

  <!-- ================= شاشة التحميل الأولية (تظهر فورًا قبل أي جافاسكريبت) ================= -->
  <div id="boot-loader">
    <div class="boot-loader-box">
      <div class="boot-spinner"></div>
      <div class="boot-loader-text" id="boot-loader-text">...جارِ التحميل / Yükleniyor...</div>
    </div>
  </div>

  <!-- ================= شاشة تسجيل الدخول ================= -->
  <div id="login-screen">
    <div class="login-card">
      <div style="display:flex; justify-content:center; gap:6px; margin-bottom:14px;">
        <button type="button" class="lang-btn" data-lang="ar">AR</button>
        <button type="button" class="lang-btn" data-lang="tr">TR</button>
      </div>
      <div class="login-logo" id="login-logo"></div>
      <div class="login-title" id="login-name">مصنع نسيج</div>
      <div class="login-sub" id="login-sub">تسجيل الدخول لإدارة المخازن</div>
      <div id="login-error" class="login-error hidden"></div>
      <form id="login-form">
        <div class="field">
          <label id="login-user-label">اسم المستخدم</label>
          <input id="login-username" autocomplete="username" required placeholder="مثال: ahmed">
        </div>
        <div class="field">
          <label id="login-pass-label">كلمة المرور</label>
          <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <div style="text-align:left; margin-bottom:14px; margin-top:-8px;">
          <button type="button" id="forgot-pass-link" style="background:none; color:var(--mustard); font-size:12px; font-weight:700;">نسيت كلمة المرور؟</button>
        </div>
        <button type="submit" id="login-submit" class="btn-primary">تسجيل الدخول</button>
      </form>
    </div>
  </div>

  <!-- ================= التطبيق بعد الدخول ================= -->
  <div id="app-shell" class="hidden">
    <div id="alert-banner" class="alert-banner hidden"></div>
    <header class="top-header">
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="إظهار/إخفاء القائمة">☰</button>
      <div class="brand">
        <div class="logo" id="side-logo"></div>
        <div>
          <div class="brand-name" id="brand-name">مصنع نسيج</div>
          <div class="brand-sub" id="brand-sub">إدارة المخازن</div>
        </div>
      </div>
      <div class="header-spacer" style="flex:1;"></div>
      <button class="bell-btn" id="help-btn" title="المساعدة">؟</button>
      <button class="bell-btn" id="about-btn" title="حول النظام">ⓘ</button>
      <div style="position:relative;">
        <button class="bell-btn" id="bell-btn">🔔<span class="bell-badge hidden" id="bell-badge">0</span></button>
        <div class="bell-dropdown hidden" id="bell-dropdown"></div>
      </div>
    </header>
    <div class="layout">
      <aside id="sidebar">
        <div id="nav-list"></div>
        <div id="mobile-extra-controls">
          <div class="who">
            <span class="who-name" id="who-name"></span>
            <button class="logout-btn" id="change-pass-btn" title="تغيير كلمة المرور">🔑</button>
            <button class="logout-btn" id="logout-btn">خروج</button>
          </div>
          <div style="padding:0 6px; margin-top:-6px;"><span id="who-role" style="font-size:10.5px; color:rgba(255,255,255,.5);"></span></div>
          <div style="display:flex; gap:6px; padding:8px 6px 0;">
            <button type="button" class="lang-btn" data-lang="ar">AR</button>
            <button type="button" class="lang-btn" data-lang="tr">TR</button>
          </div>
          <div style="display:flex; gap:6px; padding:8px 6px 0;">
            <button type="button" class="lang-btn" id="help-btn-mobile">؟ مساعدة</button>
            <button type="button" class="lang-btn" id="about-btn-mobile">ⓘ حول النظام</button>
          </div>
        </div>
        <div class="nav-footer">البيانات محفوظة تلقائيًا ومشتركة بين كل العاملين المسجّلين</div>
      </aside>
      <div class="content-col">
        <main id="main"></main>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
